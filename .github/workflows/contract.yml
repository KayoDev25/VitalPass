# Compila y prueba el contrato de Stellar en los servidores de GitHub,
# así nadie del equipo necesita instalar Rust en su computadora.
# El archivo compilado (.wasm) se guarda en contracts/apto_registry.wasm.
name: Contrato Stellar

on:
  push:
    paths:
      - "contracts/apto-registry/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/apto-registry
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32v1-none

      - name: Tests del contrato
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test.log; then
            MSG=$(grep -v "Compiling\|Downloaded\|Downloading" test.log | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cargo test::$MSG"
            exit 1
          fi

      - name: Instalar stellar-cli (herramienta oficial de Stellar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo stellar/stellar-cli --pattern 'stellar-cli-*-x86_64-unknown-linux-gnu.tar.gz' --dir /tmp/stellar
          tar -xzf /tmp/stellar/*.tar.gz -C /tmp/stellar
          sudo install /tmp/stellar/stellar /usr/local/bin/stellar
          stellar --version

      - name: Compilar a WebAssembly
        run: |
          set -o pipefail
          if ! stellar contract build 2>&1 | tee build.log; then
            MSG=$(grep -v "Compiling\|Downloaded\|Downloading" build.log | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cargo build::$MSG"
            exit 1
          fi
          cp target/wasm32v1-none/release/apto_registry.wasm ../apto_registry.wasm
          ls -la ../apto_registry.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: apto_registry
          path: contracts/apto_registry.wasm

      - name: Guardar el .wasm en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../apto_registry.wasm
          git diff --cached --quiet || (git commit -m "build: wasm del contrato [skip ci]" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME")
